<svg xmlns="http://www.w3.org/2000/svg" viewBox="132 400 908 525" role="img" aria-label="Seis vizinhos e uma criança de mãos dadas numa rua da cidade, à noite">
<style>
.crowd{animation:bob 1.1s ease-in-out infinite}
.lane{animation:lane 1.1s linear infinite}
.spin{transform-box:view-box;animation:spin 3.3s linear infinite}
.wave{transform-box:view-box;animation:wave 1.6s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes lane{from{stroke-dashoffset:0}to{stroke-dashoffset:78}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wave{0%,100%{transform:rotate(0deg)}50%{transform:rotate(14deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@media (prefers-reduced-motion: reduce){.crowd,.lane,.spin,.wave,.blink{animation:none}}
</style>

